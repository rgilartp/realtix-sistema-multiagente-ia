name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  # SHA-256 de gitleaks_8.30.1_linux_x64.tar.gz, fijado aquí (auditoría de seguridad): coincide con
  # el checksums.txt y con el digest del release, pero no se confía en un archivo del mismo release.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # Credenciales de desarrollo de .env.example; solo existen en el servicio efímero de la CI.
  DATABASE_URL_PRUEBAS: postgresql://realtix:realtix_dev@localhost:5432/realtix

jobs:
  verificar:
    name: Ganchos, secretos y pruebas
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: realtix
          POSTGRES_PASSWORD: realtix_dev
          POSTGRES_DB: realtix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realtix -d realtix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      chromadb:
        # La imagen no trae curl ni shell para un healthcheck; se espera desde el runner.
        image: chromadb/chroma:1.5.9
        env:
          ANONYMIZED_TELEMETRY: "FALSE"
        ports:
          - 8000:8000
    steps:
      - name: Traer el repositorio con todo su historial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instalar uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Instalar las dependencias
        run: uv sync --all-groups --locked

      - name: Ganchos de pre-commit
        # no-commit-to-branch se omite porque en push a main fallaría por diseño.
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch

      - name: Gitleaks sobre todo el historial del repositorio
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archivo" "$base/$archivo"
          echo "${GITLEAKS_SHA256}  $archivo" | sha256sum -c -
          tar -xzf "$archivo" gitleaks
          ./gitleaks git --redact --verbose .

      - name: Esperar a Chroma
        run: |
          for _ in $(seq 1 30); do
            curl -sf localhost:8000/api/v2/heartbeat && exit 0
            sleep 2
          done
          echo "Chroma no respondió" && exit 1

      - name: Pruebas con cobertura
        # Con POSTGRES_OBLIGATORIO y CHROMA_OBLIGATORIO las pruebas de integración fallan, no se
        # saltan, si el servicio no responde.
        run: uv run pytest -q --cov=src --cov=scripts --cov-report=term
        env:
          POSTGRES_OBLIGATORIO: "1"
          CHROMA_OBLIGATORIO: "1"

  web:
    name: Web (compilación y Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar las dependencias
        run: npm ci --no-audit --no-fund

      - name: Contraste WCAG de los dos modos
        run: npm run contraste

      - name: Compilar
        run: npm run build

      - name: Instalar Chromium y sus dependencias del sistema
        run: npx playwright install --with-deps chromium

      - name: Pruebas de Playwright (API simulada en el navegador)
        run: npx playwright test
