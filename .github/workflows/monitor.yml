name: Monitor de /health

# RNF-06 · Horario de atención: revisa /health del despliegue cada 15 minutos dentro del horario
# hábil (lunes a viernes, de 8:00 a 16:45 en Bogotá, UTC-5), desde el despliegue (B13). Fuera del
# horario no corre: el repositorio es privado y el plan gratuito de GitHub tiene 2.000 minutos al
# mes; cada 15 minutos todo el día serían unos 2.880 y dejarían sin minutos a la CI. El dominio es
# la variable del repositorio DOMINIO. GitHub lanzó el schedule muy pocas veces (PR #79): desde
# B15, la disponibilidad sale del monitor del servidor (deploy/README.md). El flujo sigue activo
# hasta que se apague el servidor, después de la sustentación.

on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  salud:
    name: /health por HTTPS
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Consultar /health
        env:
          DOMINIO: ${{ vars.DOMINIO }}
        run: |
          test -n "$DOMINIO" || { echo "Falta la variable DOMINIO del repositorio"; exit 1; }
          respuesta=$(curl -fsS --retry 2 --retry-delay 10 --max-time 20 "https://${DOMINIO}/health")
          echo "$respuesta"
          echo "$respuesta" | grep -q '"estado":"ok"'
