        El art. 52 del Acuerdo 1084 de 2026 derogó el Acuerdo 77 de 2002, que este artículo cita. El predial
        se causa el 1 de enero de cada año gravable (Decreto 352 de 2002, art. 15), de modo que para 2026 rige
        este texto y desde 2027 la exclusión de los estratos 1 y 2 está en el art. 20 del Acuerdo 1084.
