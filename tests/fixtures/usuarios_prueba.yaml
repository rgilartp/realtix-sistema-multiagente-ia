# Usuarios de prueba fijos (sección 4.2) y sus valores ESPERADOS.
#
# Cada valor esperado está escrito a mano a partir de la norma y NO se calcula con ninguna
# función del repositorio: base, tarifa por mil, valor en pesos, descuento y fuente. La prueba
# (tests/test_usuarios_prueba.py) exige que coincidan tres cosas: este archivo, lo que devuelve
# buscar_tarifa_ipu / buscar_tarifa_ica y lo que quedó en la base sintética.
#
# Descuento = 10 % del valor por pronto pago hasta el 17 de abril de 2026 (Resolución SDH-000195
# de 2025, art. 6). Estrato 4, 5 y 6 y los de más de 135 SMMLV usan los rangos generales de la
# Resolución SDH-000194 de 2025, art. 1 (la tarifa de cada avalúo se lee de esa tabla, no se
# deduce). SMMLV de 2026 = $1.750.905 (Decreto 1469 de 2025): 16 = $28.014.480,
# 107 = $187.346.835 y 135 = $236.372.175.
#
# Los grupos de `cubre` son los de la sección 6.3 de la especificación técnica.
#
# Excepción: `obligaciones` (por vigencia) y `pagos` se copiaron de la base sintética con la semilla
# 42, porque las vigencias 2023 a 2025 usan valores sintéticos sin fuente normativa. Son la referencia
# de los escenarios CA-01 a CA-03; test_usuarios_prueba.py comprueba que el adaptador los devuelva.
sintetico: true
fuente_general_ipu_2026: Resolución SDH-000194 de 2025, arts. 1 y 2
fuente_preferencial_ipu_2026: Acuerdo 648 de 2016, art. 1, y Acuerdo 780 de 2020, art. 3, par. 2
