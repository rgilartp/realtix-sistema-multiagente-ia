# Conjunto de enrutamiento (sección 6.2): 100 consultas etiquetadas, 20 por categoría.
#
# Regla de categorías (la misma va al prompt del orquestador en B7; los 60 escenarios la siguen):
# - general: la definición en lenguaje sencillo de un término, como los del glosario de
#   plataforma_general (sobretasa, SPAC, IVIUR, regímenes del ICA, dato personal) o el avalúo
#   catastral; el uso de la OVT simulada; los datos personales; el saludo, la pregunta por la IA y
#   la solicitud de un funcionario.
# - ipu o ica: las reglas, los cálculos, los plazos o la situación del contribuyente en ese tributo
#   (cuánto, hasta cuándo, en qué régimen, cuánto debo, estimación).
# - Excepción: «qué es el predial» y «qué es el ICA» son consultas conceptuales de su agente
#   (RF-IPU-01 y RF-ICA-01), aunque el glosario defina el impuesto predial unificado.
# - ocr: la consulta llega con un archivo adjunto (recibo u otro documento).
# - fuera_de_alcance: lo no tributario y los tributos o municipios que el MVP no cubre.
#
# Las de ocr llevan un adjunto simulado: tipo recibo_sintetico (con su calidad) u otro_documento.
# Municipio distinto de Bogotá: Medellín.
