id: ICA-04
titulo: Estimación anual del ICA de 2026 en régimen preferencial
origen:
- especificacion-6.3
rf:
- RF-ICA-02
- RF-AUT-01
hu:
- HU-07
grupo: ica
categoria_esperada: ica
comportamiento_esperado: responder
sesion: U05
reloj: '2026-10-01T10:00:00-05:00'
tipo_latencia: simple
turnos:
- usuario: Mi actividad es la 6201 y calculo ingresos de $60.000.000 en el año, ¿cuánto sería el ICA?
verificaciones_codigo:
- tipo: contiene_valor
  valor: '579.600'
- tipo: contiene_texto
  valor: 9,66 por mil
- tipo: contiene_texto
  valor: estimación
respuesta_referencia: >-
  Para la actividad 6201 la tarifa de 2026 es 9,66 por mil (Acuerdo 65 de 2002, art. 3, texto original):
  $60.000.000 × 9,66 / 1.000 = $579.600. Como el año aún no termina, es una proyección del año completo
  con los ingresos que indica el contribuyente, y una estimación no vinculante. La estimación no incluye
  el complementario de avisos y tableros (15 % del impuesto, Decreto 352 de 2002, art. 59) ni la sobretasa
  bomberil, que se suman cuando aplican.
fuentes_esperadas:
- Acuerdo 65 de 2002, art. 3
- datos/tarifas/ica_2026.yaml
- Usuario de prueba U05
no_debe:
- presentar el valor como el impuesto definitivo del año
- omitir la nota de estimación
dado_cuando_entonces:
  dado: U05 con sesión, régimen preferencial y actividad 6201
  cuando: Pide una estimación con $60.000.000 de ingresos en el año
  entonces: Recibe $579.600 como proyección anual, con tarifa y notas
