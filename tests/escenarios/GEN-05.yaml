respuesta_referencia: >-
  El IVIUR es el Índice de Valoración Inmobiliaria Urbana y Rural. Desde el predial de 2027, su variación
  anual sirve para actualizar cada año los rangos que determinan la tarifa del impuesto predial unificado
  (Acuerdo 1084 de 2026, art. 20).
