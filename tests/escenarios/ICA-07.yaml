respuesta_referencia: >-
  U04 es régimen común con declaración bimestral. Las fechas de 2026 son el 10 de abril, el 12 de junio,
  el 21 de agosto, el 9 de octubre y el 11 de diciembre de 2026, y el 12 de febrero de 2027 (Resolución
  SDH-000195 de 2025, art. 1). La próxima es el 9 de octubre de 2026.
