respuesta_referencia: >-
  Es el Sistema de Pago Alternativo por Cuotas Voluntario del impuesto predial unificado. En 2026 se presenta
  la declaración inicial hasta el 8 de mayo y se paga en cuatro cuotas iguales (Acuerdo 648 de 2016, art.
  3; Resolución SDH-000195 de 2025, art. 5).
