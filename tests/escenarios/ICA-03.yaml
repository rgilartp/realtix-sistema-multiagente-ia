turnos:
- usuario: ¿Cada cuánto se declara el ICA en 2026?
verificaciones_codigo:
- tipo: contiene_texto
  valor: 391 UVT
- tipo: contiene_valor
  valor: '19.471.409'
respuesta_referencia: >-
  En 2026, los contribuyentes del régimen común cuyo impuesto a cargo de 2025 supera 391 UVT ($19.471.409)
  declaran y pagan cada dos meses; los del régimen común con impuesto de hasta 391 UVT y los del régimen
  preferencial presentan una declaración anual (Resolución SDH-000195 de 2025, art. 1).
fuentes_esperadas:
- Resolución SDH-000195 de 2025, art. 1
- datos/regimenes_ica.yaml
no_debe:
- aplicar a 2026 las reglas de régimen que rigen desde 2027
dado_cuando_entonces:
  dado: Un contribuyente sin sesión
  cuando: Pregunta la periodicidad del ICA
  entonces: Recibe la regla de 2026 con el umbral de 391 UVT en pesos
