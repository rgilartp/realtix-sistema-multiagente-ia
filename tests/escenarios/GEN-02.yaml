turnos:
- usuario: ¿Puedo pagar mi predial o presentar mi declaración con el asistente?
verificaciones_codigo:
- tipo: contiene_texto
  valor: declaraciones
- tipo: no_contiene_texto
  valor: sí puedo pagar
respuesta_referencia: >-
  No. El asistente no presenta declaraciones, no hace pagos y no modifica datos; tampoco da asesoría tributaria
  personalizada, sus respuestas son orientativas. Sí puede responder sobre el impuesto predial unificado,
  el de industria y comercio, los datos personales y el uso de la plataforma.
