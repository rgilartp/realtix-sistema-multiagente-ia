turnos:
- usuario: ¿Qué derechos tengo sobre mis datos personales?
verificaciones_codigo:
- tipo: contiene_texto
  valor: conocer, actualizar y rectificar
- tipo: contiene_texto
  valor: Ley 1581
respuesta_referencia: >-
  El titular de los datos personales puede conocer, actualizar y rectificar sus datos; solicitar prueba
  de la autorización otorgada; ser informado del uso que se les ha dado; presentar quejas ante la Superintendencia
  de Industria y Comercio; revocar la autorización o solicitar la supresión del dato, en los casos que
  la ley prevé; y acceder gratuitamente a sus datos (Ley 1581 de 2012, art. 8).
fuentes_esperadas:
- Ley 1581 de 2012, art. 8
no_debe:
- decir que el titular no puede revocar la autorización
