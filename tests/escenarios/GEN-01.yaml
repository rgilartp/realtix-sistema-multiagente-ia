respuesta_referencia: >-
  Se abre la página de la OVT simulada, se elige un usuario de prueba en el selector y la página da una
  sesión que dura 2 horas; pasado ese tiempo hay que elegir el usuario otra vez. Sin sesión, el asistente
  solo responde consultas generales.
