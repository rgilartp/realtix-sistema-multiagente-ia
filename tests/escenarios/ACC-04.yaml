- tipo: no_pide_sesion
respuesta_referencia: >-
  Para la actividad 6201 (desarrollo de sistemas informáticos), la tarifa del ICA de 2026 es 9,66 por
  mil (Acuerdo 65 de 2002, art. 3, texto original). Desde el 1 de enero de 2027 para los declarantes anuales,
  y desde el bimestre 6 de 2026 para los bimestrales, la tarifa es 10 por mil (Acuerdo 1084 de 2026, art.
  21). Es una consulta general: no requiere sesión.
