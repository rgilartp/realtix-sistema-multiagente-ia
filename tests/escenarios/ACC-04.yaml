- usuario: >-
    ¿Qué tarifa de industria y comercio paga en Bogotá la actividad 6201, desarrollo de software?
verificaciones_codigo:
- tipo: contiene_texto
  valor: '9,66'
- tipo: contiene_texto
  valor: '6201'
- tipo: contiene_texto
