- usuario: ¿Cuándo se causa el predial y qué período cubre?
verificaciones_codigo:
- tipo: contiene_texto
  valor: 1° de enero
- tipo: contiene_texto
  valor: Decreto 352
respuesta_referencia: >-
  El predial es un gravamen real sobre los bienes raíces ubicados en Bogotá y se genera por la existencia
  del predio (Decreto 352 de 2002, art. 14). Se causa el 1° de enero del año gravable (art. 15) y el período
  gravable es anual, del 1° de enero al 31 de diciembre (art. 16).
fuentes_esperadas:
- Decreto 352 de 2002, arts. 14, 15 y 16
