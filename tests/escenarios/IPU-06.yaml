sesion: null
reloj: '2026-10-01T10:00:00-05:00'
tipo_latencia: simple
turnos:
- usuario: ¿Qué tarifa de predial pagan los estratos 1, 2 y 3 en 2026?
verificaciones_codigo:
- tipo: contiene_texto
  valor: 1 por mil
- tipo: contiene_texto
  valor: 3 por mil
- tipo: contiene_valor
  valor: '28.014.480'
respuesta_referencia: >-
  En 2026, los predios residenciales de estratos 1 y 2 con avalúo de más de 16 y hasta 107 SMMLV pagan
  1 por mil; los de más de 107 y hasta 135 SMMLV, 3 por mil; el estrato 3 con avalúo de hasta 135 SMMLV
  paga 3 por mil (Acuerdo 648 de 2016, art. 1, y Acuerdo 780 de 2020, art. 3, par. 2). Los estratos 1
  y 2 con avalúo de hasta 16 SMMLV ($28.014.480, con el SMMLV de 2026 de $1.750.905) no declaran ni pagan
  (Decreto 639 de 2025, art. 207).
fuentes_esperadas:
- Acuerdo 648 de 2016, art. 1
- Acuerdo 780 de 2020, art. 3, par. 2
- Decreto 639 de 2025, art. 207
- datos/tarifas/ipu_2026.yaml
no_debe:
- presentar las tarifas preferenciales como nuevas de 2027
- cobrar a un avalúo de hasta 16 SMMLV
dado_cuando_entonces:
  dado: Un contribuyente sin sesión
  cuando: Pregunta por las tarifas de los estratos bajos
  entonces: Recibe las tres tarifas con sus límites en SMMLV y en pesos
