- presentar el descuento del 10 % como vigente, porque venció el 17 de abril de 2026
dado_cuando_entonces:
  dado: Un contribuyente sin sesión; el reloj está en octubre de 2026
  cuando: Pregunta hasta cuándo hay descuento en 2026
  entonces: Recibe la fecha y el porcentaje, y que el plazo ya venció
