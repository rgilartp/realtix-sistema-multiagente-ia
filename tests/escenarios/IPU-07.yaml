respuesta_referencia: >-
  Quien declara y paga todo el impuesto de 2026, o paga el total por factura, a más tardar el 17 de abril
  de 2026 tiene un descuento del 10 % sobre el valor a pagar (Resolución SDH-000195 de 2025, art. 6).
  También aplica a quien se acogió al SPAC y paga todo a más tardar en esa fecha. Ese plazo ya venció.
