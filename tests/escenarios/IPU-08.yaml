  valor: 10 de julio de 2026
respuesta_referencia: >-
  Los contribuyentes del predial de 2026 deben declarar y pagar, a más tardar, el 10 de julio de 2026
  (Resolución SDH-000195 de 2025, art. 3); con facturación, el valor total se paga a más tardar en esa
  misma fecha (art. 4).
