respuesta_referencia: >-
  En los predios con avalúo actualizado que pagaron según esa actualización, el impuesto puede subir como
  máximo el IPC más 8 puntos porcentuales; en los que no se han actualizado, el límite es el 50 % del
  monto liquidado el año anterior; en las viviendas de estratos 1 y 2 con avalúo de hasta 135 SMMLV, el
  incremento no puede pasar del 100 % del IPC (Ley 1995 de 2019, art. 2, con excepciones como los terrenos
  urbanizables no urbanizados). La Ley 1995 sigue vigente: la Ley 2294 de 2023, art. 49, parágrafo 3,
  mantiene lo dispuesto en ella hasta que se expida una nueva ley.
fuentes_esperadas:
- Ley 1995 de 2019, art. 2
- Ley 2294 de 2023, art. 49, par. 3
no_debe:
