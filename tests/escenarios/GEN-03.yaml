respuesta_referencia: >-
  Es una sobretasa al impuesto predial unificado con destino al servicio de alumbrado público. Rige desde
  el 1 de enero de 2027 (Acuerdo 1084 de 2026, art. 10); la pagan los contribuyentes del predial en Bogotá
  (art. 11) y su base gravable es la misma del predial de la vigencia (art. 13).
