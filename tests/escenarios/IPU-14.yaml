id: IPU-14
titulo: Beneficio de intereses y sanciones de 2026
origen:
- especificacion-6.3
rf:
- RF-IPU-04
- RF-IPU-05
hu:
- HU-03
grupo: ipu
categoria_esperada: ipu
comportamiento_esperado: responder
sesion: U02
reloj: '2026-10-01T10:00:00-05:00'
tipo_latencia: simple
turnos:
- usuario: Tengo un predio con deuda vencida, ¿hay algún beneficio en los intereses?
verificaciones_codigo:
- tipo: contiene_texto
  valor: 60 %
- tipo: contiene_texto
  valor: 21 de diciembre de 2026
respuesta_referencia: >-
  El Acuerdo 1084 de 2026 creó un alivio que existe desde su publicación, el 9 de octubre de 2026. Los
  obligados de los impuestos distritales que, a esa fecha, tengan obligaciones tributarias pendientes
  de pago pueden descontar el 60 % de los intereses y las sanciones causados, siempre que, a más tardar
  el 21 de diciembre de 2026, paguen el 100 % del capital adeudado y el 40 % de los intereses y las sanciones
  causados a la fecha de pago, y siempre que hagan el pago total en un solo momento, a más tardar en esa
  misma fecha (Acuerdo 1084 de 2026, art. 7.1 y parágrafo 3). El predio 50C-9000202 de U02 tiene 2 vigencias
  vencidas (2025 y 2026) y un saldo pendiente de $5.166.000.
fuentes_esperadas:
- Acuerdo 1084 de 2026, art. 7
- Usuario de prueba U02 (usuarios_prueba.yaml)
no_debe:
- prometer un descuento sobre el capital
- dar una fecha límite distinta del 21 de diciembre de 2026
- presentar el alivio como vigente antes del 9 de octubre de 2026
- omitir que la deuda debía estar pendiente a la publicación del acuerdo
- ofrecer el alivio con pagos parciales o por cuotas
dado_cuando_entonces:
  dado: U02 con sesión y un predio con dos vigencias vencidas
  cuando: Pregunta si hay un beneficio en los intereses
  entonces: Recibe el 60 % de descuento de intereses y sanciones, las condiciones y la fecha límite
