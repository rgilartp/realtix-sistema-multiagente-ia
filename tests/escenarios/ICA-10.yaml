respuesta_referencia: >-
  Explica, antes de transferir, que la retención de ICA está fuera de lo que atiende este canal, que solo
  cubre el impuesto predial unificado y el de industria y comercio de Bogotá, sin retenciones; luego transfiere
  la consulta a un funcionario y avisa que el caso queda registrado con un resumen de la conversación.
