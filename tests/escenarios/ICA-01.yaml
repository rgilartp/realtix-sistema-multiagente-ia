tipo_latencia: simple
turnos:
- usuario: ¿Qué es el impuesto de industria y comercio y quién lo paga?
verificaciones_codigo:
- tipo: contiene_texto
  valor: actividad
- tipo: contiene_texto
  valor: Decreto 352
respuesta_referencia: >-
  El hecho generador del impuesto de industria y comercio es el ejercicio o realización directa o indirecta
  de cualquier actividad industrial, comercial o de servicios en la jurisdicción de Bogotá, de forma permanente
  u ocasional, en inmueble determinado, con establecimientos de comercio o sin ellos (Decreto 352 de 2002,
  art. 32). Es sujeto pasivo la persona natural o jurídica, o la sociedad de hecho, que realiza el hecho
  generador (art. 41).
fuentes_esperadas:
- Decreto 352 de 2002, arts. 32 y 41
no_debe:
- omitir la cita de la norma
