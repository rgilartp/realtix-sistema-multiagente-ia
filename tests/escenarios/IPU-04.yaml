respuesta_referencia: >-
  El impuesto predial unificado fusiona en un solo impuesto el predial, el de parques y arborización,
  el de estratificación socioeconómica y la sobretasa de levantamiento catastral (Ley 44 de 1990, art.
  1). Su base gravable es el avalúo catastral o el autoavalúo (art. 3) y la tarifa la fijan los concejos
  municipales y distritales, entre el 5 y el 16 por mil del avalúo, de forma diferencial y progresiva
  (art. 4, modificado por la Ley 1450 de 2011).
fuentes_esperadas:
- Ley 44 de 1990, arts. 1, 3 y 4
no_debe:
- dar una tarifa única para todos los predios
- omitir la cita de la norma
