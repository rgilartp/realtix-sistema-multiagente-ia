respuesta_referencia: >-
  Predial: el de 2026 del predio 50C-9001201 ya está pagado ($2.583.000) y el predio está al día; ese
  valor corresponde al avalúo de $410.000.000 con tarifa de 6,3 por mil (Resolución SDH-000194 de 2025,
  art. 1): $410.000.000 × 6,3 / 1.000 = $2.583.000. ICA: U12 es régimen común anual y declara el año gravable
  2026 a más tardar el 26 de febrero de 2027 (Resolución SDH-000195 de 2025, art. 1).
fuentes_esperadas:
- Resolución SDH-000194 de 2025, art. 1
- Resolución SDH-000195 de 2025, art. 1
- Usuario de prueba U12 (usuarios_prueba.yaml)
no_debe:
- presentar el predial de 2026 como pendiente de pago
- responder solo una de las dos partes
dado_cuando_entonces:
  dado: U12 con sesión, el predial de 2026 pagado y el ICA anual pendiente
  cuando: Pide la estimación del predial y la fecha del ICA en un solo mensaje
  entonces: >-
    Recibe que el predial de 2026 ya está pagado, con su valor, y la fecha de declaración del ICA
