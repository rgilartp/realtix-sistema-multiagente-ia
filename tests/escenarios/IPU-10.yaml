respuesta_referencia: >-
  El predio 50C-9000301 (residencial, estrato 4, avalúo de $350.000.000) cae en el rango de $332.318.001
  a $363.632.000, con tarifa de 6,1 por mil (Resolución SDH-000194 de 2025, art. 1): $350.000.000 × 6,1
  / 1.000 = $2.135.000. Con el 10 % de pronto pago habría sido $1.921.500, pero ese descuento venció el
  17 de abril de 2026. Es una estimación no vinculante: en la factura y en la declaración los valores
  se aproximan al múltiplo de mil más cercano.
fuentes_esperadas:
- Resolución SDH-000194 de 2025, art. 1
- Resolución SDH-000195 de 2025, art. 6
- Decreto 807 de 1993, arts. 15 y 132
no_debe:
- presentar como vigente el descuento del 10 %, que venció el 17 de abril de 2026
- omitir la nota de estimación no vinculante
dado_cuando_entonces:
  dado: U03 con sesión y un predio residencial de avalúo $350.000.000
  cuando: Pide la estimación del predial de este año
  entonces: Recibe la estimación de 2026 con tarifa, base, valor y la nota de estimación no vinculante
