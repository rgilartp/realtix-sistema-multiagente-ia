- tipo: contiene_texto
  valor: divulgación adicional
respuesta_referencia: >-
  Las facturas se notifican mediante publicación en el Registro Distrital y, simultáneamente, mediante
  inserción en la página web de la Secretaría Distrital de Hacienda. El envío de la factura a la dirección
  del contribuyente surte el efecto de divulgación adicional (Acuerdo 1084 de 2026, art. 27, numeral 3).
fuentes_esperadas:
- Acuerdo 1084 de 2026, art. 27, num. 3
no_debe:
- decir que la notificación se hace solo con el envío a la casa
dado_cuando_entonces:
  dado: Un contribuyente sin sesión
  cuando: Pregunta cómo le notifican la factura
  entonces: Recibe la publicación en el Registro Distrital y en la web, y que el envío es adicional
