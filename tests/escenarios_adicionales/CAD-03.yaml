respuesta_referencia: 'Parte 1 (OCR-07): Tras la confirmación, contrasta los datos del recibo con el estado
  de cuenta del predio 50C-9000301: el avalúo de $350.000.000 y el valor liquidado de $2.135.000 coinciden,
  y el predio tiene 1 obligación vencida con un saldo de $2.135.000. Parte 2 (IPU-07): Quien declara y
  paga todo el impuesto de 2026, o paga el total por factura, a más tardar el 17 de abril de 2026 tiene
  un descuento del 10 % sobre el valor a pagar (Resolución SDH-000195 de 2025, art. 6). También aplica
  a quien se acogió al SPAC y decide pagar todo en esa fecha. Ese plazo ya venció.'
