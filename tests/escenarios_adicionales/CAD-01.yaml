respuesta_referencia: 'Parte 1 (IPU-01): Estado de cuenta del predio 50C-9000301, por vigencia: 2023,
  2024 y 2025 al día; 2026 vencida, por $2.135.000 (el plazo era el 10 de julio de 2026). Saldo pendiente:
  $2.135.000. Parte 2 (IPU-10): El predio 50C-9000301 (residencial, estrato 4, avalúo de $350.000.000)
  cae en el rango de $332.318.001 a $363.632.000, con tarifa de 6,1 por mil (Resolución SDH-000194 de
  2025, art. 1): $350.000.000 × 6,1 / 1.000 = $2.135.000. Con el 10 % de pronto pago habría sido $1.921.500,
  pero ese descuento venció el 17 de abril de 2026. Además, el predial de 2026 de este predio está vencido
  desde el 10 de julio de 2026 (Resolución SDH-000195 de 2025, art. 3), así que el pago ahora incluye
  intereses de mora (Decreto 807 de 1993, art. 66), que la estimación no calcula. Es una estimación no
  vinculante: en la factura y en la declaración los valores se aproximan al múltiplo de mil más cercano
  (Decreto 807 de 1993, arts. 15 y 132). Parte 3 (IPU-08): Los contribuyentes del predial de 2026 deben
  declarar y pagar, a más tardar, el 10 de julio de 2026 (Resolución SDH-000195 de 2025, art. 3); con
  facturación, el valor total se paga a más tardar en esa misma fecha (art. 4). Ese plazo ya venció.'
