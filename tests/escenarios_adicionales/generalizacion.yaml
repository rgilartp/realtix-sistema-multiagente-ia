# R1 (ADR-24): conjunto de generalización. 10 variantes parafraseadas de escenarios aprobados de un
# turno con recuperación, con la misma referencia, las mismas verificaciones y la misma sesión de su
# escenario de origen. Dayanna escribió cada variante en `variante`, con otras palabras y sin copiar
# la pregunta original, y Rodolfo las aprobó; van tal cual, con su ortografía, porque son parte de
# la prueba. Una variante vacía no se corre. Solo corren en la corrida 3 y se reportan
# aparte de los 60. Regla A8: ningún texto de estas variantes puede aparecer en prompts ni en código.
variantes:
