    a 16 SMMLV
  limite_de_16_smmlv: En 2027 solo queda excluido lo «inferior a 16 SMMLV» (Acuerdo 1084, art. 20); 16 SMMLV exactos
    pagan 1 por mil.
  mantiene: 'Las preferenciales de 1 y 3 por mil no son nuevas: existen desde 2017 (Acuerdo 648 de 2016, art. 1)
    y siguieron de 2021 a 2026 (Acuerdo 780 de 2020, art. 3, parágrafo 2). El Acuerdo 1084 las mantiene para 2027
    y nombra además a los predios rurales con destino agropecuario y a los residenciales rurales.'
