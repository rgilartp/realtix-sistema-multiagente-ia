aplicacion:
  texto_del_acuerdo: 'Art. 21, parágrafo: a los obligados a declarar con periodicidad anual cuando entre en vigencia
    el acuerdo se les aplican las tarifas desde el 1 de enero de 2027; a los obligados a declarar cada dos meses,
    desde el bimestre siguiente a la aprobación del acuerdo.'
  aprobacion_en_plenaria: '28 de septiembre de 2026 (prensa: El Tiempo e Infobae)'
  fecha_del_acuerdo: 8 de octubre de 2026 (PDF firmado)
  periodos_que_cubre:
    declarantes_anuales: año gravable 2027 en adelante (desde el 1 de enero de 2027)
    declarantes_bimestrales: desde el bimestre 6 de 2026 (noviembre-diciembre, que se declara a más tardar el 12
      de febrero de 2027); la aprobación y la fecha del acuerdo caen en el bimestre 5 (septiembre-octubre)
  tabla_anterior: ica_2026.yaml cubre el año gravable 2026 de los anuales y los bimestres 1 a 5 de 2026 de los bimestrales
lectura: 'Doble lectura: texto digital del Régimen Legal de Bogotá (el art. 21 también está como art. 3 del Acuerdo
