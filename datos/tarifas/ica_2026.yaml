  decision: 'Decisión de Rodolfo en la parada de B2: prevalece la Resolución SDH-000265 de 2021, que es la clasificación
    con la que Hacienda aplica el art. 6 del Acuerdo 780, se expidió después de ese acuerdo y no tiene modificaciones
    ni nulidades; el art. 21 del Acuerdo 1084 conserva la misma agrupación para 2027'
  fuente_de_la_tarifa: Resolución SDH-000265 de 2021, art. 1 (clasificación oficial por CIIU de la Secretaría de
    Hacienda)
  nota_para_el_agente: El art. 6 del Acuerdo 780 de 2020 nombra a los contratistas de construcción, constructores
    y urbanizadores en el grupo que sube a 8,66 por mil; la Secretaría de Hacienda clasificó esta actividad en la
    tarifa indicada, que es la que aplica.
criterio_de_la_resolucion_265: La Resolución SDH-000265 de 2021 asigna cada CIIU a un grupo del art. 3 y, en el
  grupo 302, a una fila del art. 6 del Acuerdo 780; la tarifa es la que fija el acuerdo vigente para ese grupo o
  esa fila. Por eso las 10 actividades de construcción quedan en 6,9 o 7,6, y 6515 y 6523 van a 14 por mil, como
  todo el grupo de actividades financieras desde el Acuerdo 816.
periodos_que_cubre:
  declarantes_anuales: año gravable 2026 (se declara en febrero de 2027)
  declarantes_bimestrales: bimestres 1 a 5 de 2026 (enero-octubre); desde el bimestre 6 de 2026 aplica ica_2027.yaml,
    porque el Acuerdo 1084 se aprobó en plenaria el 28 de septiembre de 2026 y se firmó el 8 de octubre de 2026,
    ambas fechas dentro del bimestre 5
  tarifas_de_2024_y_siguientes: las de la columna de 2024 de la resolución rigen desde el año gravable 2024
  entrada_en_vigencia_del_acuerdo_1084: 9 de octubre de 2026 (Registro Distrital 8679), dentro del bimestre 5
