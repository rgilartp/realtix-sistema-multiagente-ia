motivo: >-
  El Régimen Legal de Bogotá solo muestra el texto original de 2002 y el texto nuevo del art. 21 del
  Acuerdo 1084 de 2026 (desde 2027). El texto vigente en 2026 lo modifican el art. 6 del Acuerdo 780
  de 2020 y el art. 4 del Acuerdo 816 de 2021, y el Acuerdo 816 no está entre las fuentes de la
  sección 5.1. No se completa con valores supuestos; falta la decisión sobre esa fuente.
