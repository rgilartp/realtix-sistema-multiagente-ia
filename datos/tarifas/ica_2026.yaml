normas_derogadas_por_el_art_52_del_acuerdo_1084:
  fijaban_tarifas_del_ica_y_se_aplican_aqui:
  - 'Acuerdo 98 de 2003 (edición y publicación de libros: 4,14 por mil, u 8 si no se cumplen las condiciones); fila
    58112'
  - 'Acuerdo 780 de 2020, art. 7 (domicilios por plataformas: 11,04 por mil desde 2024); fila 5330'
  - Acuerdo 1019 de 2025, art. 44 (ICA consolidado del régimen SIMPLE en 2026); sección regimen_simple_2026
  rigen_para: Los periodos de esta tabla (año gravable 2026 de los anuales y bimestres 1 a 5 de los bimestrales);
    el art. 52 del Acuerdo 1084 las deroga y el art. 21 las reemplaza según su parágrafo. El SIMPLE de 2026 rige
    todo el año y desde 2027 aplica el art. 24
  no_fijan_tarifas_del_ica: arts. 7 y 8 del Decreto 807 de 1993; art. 27 del Acuerdo 65 de 2002 (exenciones); Acuerdo
    77 de 2002 y Acuerdo 185 de 2005 (predial); arts. 12 a 14 del Acuerdo 469 de 2011 y art. 9 del Acuerdo 671 de
    2017 (notificaciones); art. 10 del Acuerdo 756 de 2019 (regímenes); Acuerdo 111 de 2003 (publicidad exterior)
    y Acuerdo 399 de 2009 (azar y espectáculos), estos dos derogados desde el 1 de enero de 2027
regimen_simple_2026:
  fuente: Acuerdo 1019 de 2025, art. 44 (derogado por el art. 52 del Acuerdo 1084)
  verificacion: 'Contrastado con el texto del art. 44 en el Régimen Legal de Bogotá (i=191818): 12, 16, 30, 30 (sic)
    y 16 por mil, fila por fila; ver contrastar_1084.py'
  rige: todo el año 2026; desde 2027 aplica el art. 24 del Acuerdo 1084 (regimen_simple_2027 en ica_2027.yaml)
  descripcion: Tarifas del ICA consolidado del régimen SIMPLE, por numeral del art. 908 del Estatuto Tributario
    Nacional
