    3 modificado por el art. 6 del Acuerdo 780 de 2020 y el art. 4 del Acuerdo 816 de 2021, con 14 por mil para
    las actividades financieras. La página no se descarga como texto, así que cada tarifa se contrastó con los acuerdos.
