    articulo: Artículo 3
    vigente: {desde: 2026-11-01}
    anterior: {hasta: 2026-12-31}
    fuente: >-
      Acuerdo 1084 de 2026, art. 21, parágrafo (nota de vigencia del archivo): el texto nuevo rige
      para los bimestrales desde el bimestre 6 de 2026 y para los anuales desde el 1 de enero de
      2027; hasta esos periodos rige el texto original con sus modificaciones.
