# Vigencias que no salen del texto de la norma (sección 5.2 y notas de B2).
#
# Cada regla dice, para un artículo de un archivo, desde y hasta cuándo rige su texto vigente
# (`vigente`) y el texto anterior que sigue a «El texto original/anterior era el siguiente:»
# (`anterior`). Las fechas salen de la nota de vigencia del archivo o de la norma que se cita en
# `fuente`. `articulo: "*"` vale para todos los artículos del archivo, y `no_rige: true` marca un
# texto que no rige en ningún año gravable de la base. Sin regla, el texto vigente rige siempre, y
# un texto anterior (o una sección marcada «Texto anterior, no vigente») no sale en ninguna
# búsqueda. Cambiar una vigencia es editar este archivo y volver a ingerir, sin tocar el código
# (RF-OBS-04).
reglas:
