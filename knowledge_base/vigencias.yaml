# Vigencias que no salen del texto de la norma (sección 5.2 y notas de B2).
#
# Cada regla dice, para un artículo de un archivo, desde y hasta cuándo rige su texto vigente
# (`vigente`) y el texto anterior que sigue a «El texto original/anterior era el siguiente:»
# (`anterior`). Las fechas salen de la nota de vigencia del archivo o de la norma que se cita en
# `fuente`. Sin regla, el texto vigente rige siempre y un texto anterior (o una sección marcada
# «Texto anterior, no vigente») no sale en ninguna búsqueda filtrada por año. Cambiar una vigencia es
# editar este archivo y volver a ingerir, sin tocar el código (RF-OBS-04).
reglas:
  - archivo: normativa_ica/acuerdo_65_2002.md
    articulo: Artículo 3
    vigente: {desde: 2026-11-01}
    anterior: {hasta: 2026-12-31}
    fuente: >-
      Acuerdo 1084 de 2026, art. 21, parágrafo (nota de vigencia del archivo): el texto nuevo rige
      para los bimestrales desde el bimestre 6 de 2026 y para los anuales desde el 1 de enero de
      2027; hasta esos periodos rige el texto original con sus modificaciones.
  - archivo: normativa_ica/acuerdo_1084_2026_ica.md
    articulo: Artículo 21
    vigente: {desde: 2026-11-01}
    fuente: >-
      Acuerdo 1084 de 2026, art. 21, parágrafo (nota de vigencia de acuerdo_65_2002.md): desde el
      bimestre 6 de 2026 para los bimestrales y desde el 1 de enero de 2027 para los anuales.
  - archivo: normativa_ica/acuerdo_1084_2026_ica.md
    articulo: Artículo 24
    vigente: {desde: 2027-01-01}
    fuente: Acuerdo 1084 de 2026, art. 24 («A partir del 1° de enero de 2027»).
  - archivo: normativa_ica/acuerdo_1084_2026_ica.md
    articulo: Artículo 26
    vigente: {desde: 2027-01-01}
    fuente: Acuerdo 1084 de 2026, art. 26 («A partir del 1º de enero de 2027»).
  - archivo: [normativa_ipu/decreto_807_1993_ipu.md, normativa_ica/decreto_807_1993_ica.md]
    articulo: Artículo 27
    vigente: {desde: 2027-01-01}
    fuente: >-
      Texto nuevo del art. 27 dado por el Acuerdo 1084 de 2026, art. 26 («A partir del 1º de enero
      de 2027»); el texto original, de 1994, no rige.
  - archivo: normativa_ica/acuerdo_1019_2025_ica.md
    articulo: Artículo 44
    vigente: {desde: 2027-01-01}
    anterior: {desde: 2026-01-01, hasta: 2026-12-31}
    fuente: >-
      Acuerdo 1019 de 2025, art. 44 («la vigencia 2026»), derogado por el Acuerdo 1084 de 2026,
      art. 52; desde el 1 de enero de 2027 aplica el art. 24 del Acuerdo 1084 (nota del archivo).
